# /etc/nginx/sites-available/tripplanner-staging
# Template para staging — reemplaza YOUR_STAGING_DOMAIN (ej: staging.tudominio.com)
#
# Instalación:
#   sudo cp docker/nginx-staging-host.conf /etc/nginx/sites-available/tripplanner-staging
#   sudo sed -i 's/YOUR_STAGING_DOMAIN/staging.tudominio.com/g' /etc/nginx/sites-available/tripplanner-staging
#   sudo ln -s /etc/nginx/sites-available/tripplanner-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_STAGING_DOMAIN

server {
    listen 80;
    server_name YOUR_STAGING_DOMAIN;

    # certbot añadirá aquí el redirect a HTTPS tras: sudo certbot --nginx -d YOUR_STAGING_DOMAIN
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_STAGING_DOMAIN;

    # certbot rellena estas líneas automáticamente:
    # ssl_certificate     /etc/letsencrypt/live/YOUR_STAGING_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_STAGING_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Estáticos de Next.js: cache largo (nombres con hash de contenido)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Necesario para NextAuth v5: detecta HTTPS tras SSL termination
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

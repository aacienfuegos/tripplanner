name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  ci:
    name: Type check, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripplanner
          POSTGRES_PASSWORD: tripplanner
          POSTGRES_DB: tripplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tripplanner:tripplanner@localhost:5432/tripplanner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Auditoría de seguridad npm
        run: node scripts/npm-audit.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: apps/web
        run: npx prisma generate

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      # Android no se compila en CI (necesita el SDK nativo), pero el type check
      # sí corre: sin él, apps/android acumula errores que nadie ve hasta que
      # alguien intenta un build local.
      - name: Type check Android
        working-directory: apps/android
        run: npx tsc --noEmit

      - name: Tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder

      # Reproduce el entrypoint real de producción/staging (docker/entrypoint.sh):
      # migraciones + `node prisma/seed.ts` ejecutado directamente por Node, no
      # por tsx ni por el bundler de Next. tsc/next build resuelven imports sin
      # extensión sin problema (son bundlers), pero la resolución ESM nativa de
      # Node exige extensión explícita en specifiers relativos — un fallo aquí
      # solo se manifiesta al arrancar el contenedor de verdad (ver #272/#273).
      - name: Migrar base de datos (smoke test)
        working-directory: apps/web
        run: npx prisma migrate deploy

      # Se ejecuta desde una copia que solo contiene prisma/, porque la imagen
      # de producción no lleva src/: un import relativo fuera de prisma/ pasa
      # este paso si se corre sobre el repo y luego mata el contenedor al
      # arrancar, dejando staging en bucle de reinicios (pasó con #325).
      - name: Smoke test del entrypoint real (node prisma/seed.ts)
        working-directory: apps/web
        run: |
          rm -rf .smoke && mkdir -p .smoke && cp -r prisma .smoke/
          node .smoke/prisma/seed.ts

      # Las e2e reutilizan la base migrada y sembrada del smoke test. Sin
      # --no-install, si el binario no se resolviera npx bajaría playwright@latest
      # fuera del lockfile y del gate, y lo ejecutaría con sudo por --with-deps.
      - name: Instalar Chromium de Playwright
        working-directory: apps/web
        run: npx --no-install playwright install --with-deps chromium

      # Desde el servidor, la conexión a estos nombres se rechaza al momento; la
      # app trata esas llamadas como opcionales y devuelve null.
      - name: Cortar terceros en el servidor
        run: |
          hosts="nominatim.openstreetmap.org open.er-api.com api.resend.com tiles.openfreemap.org openmaptiles.github.io"
          echo "127.0.0.1 $hosts" | sudo tee -a /etc/hosts
          echo "::1 $hosts" | sudo tee -a /etc/hosts
          for h in $hosts; do
            getent hosts "$h" | tee /dev/stderr | grep -Eq '^(127\.0\.0\.1|::1)[[:space:]]' || { echo "$h no resuelve a local"; exit 1; }
          done
          if node -e 'fetch("https://nominatim.openstreetmap.org/").then(() => process.exit(0), () => process.exit(1))'; then
            echo "nominatim.openstreetmap.org sigue respondiendo"
            exit 1
          fi
          echo "fetch a nominatim.openstreetmap.org rechazado, como se esperaba"

      # Valores públicos, solo para la CI y en local; el .env de staging lleva otros.
      - name: Pruebas e2e
        working-directory: apps/web
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-placeholder
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"
          ALLOW_DEV_LOGIN: "true"
          DEV_ADMIN_EMAIL: admin@dev.local
          DEV_ADMIN_PASSWORD: e2e-solo-ci
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Subir artefactos de las e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: error

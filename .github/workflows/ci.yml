name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  ci:
    name: Type check, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Auditoría de seguridad npm
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder

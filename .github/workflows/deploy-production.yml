name: Build and Push Production Image

on:
  push:
    branches:
      - main

concurrency:
  group: build-production
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  checks:
    name: Type check y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Auditoría de seguridad npm
        run: npm audit --audit-level=moderate

  build:
    name: Build, scan y push imagen producción
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login a ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build imagen (local, para scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/aacienfuegos/tripplanner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Trivy v0.71.0
        run: |
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz" \
            -O /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan de seguridad con Trivy
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --vuln-type os,library \
            ghcr.io/aacienfuegos/tripplanner:latest

      - name: Push imagen
        run: docker push ghcr.io/aacienfuegos/tripplanner:latest

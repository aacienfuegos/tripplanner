name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe 'yes' para confirmar el despliegue a producción"
        required: true
        default: "no"

jobs:
  guard:
    name: Verificar confirmación
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar input
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "Deploy cancelado: el input de confirmación no era 'yes'."
          exit 1

  deploy:
    name: Deploy producción
    runs-on: ubuntu-latest
    needs: guard
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 2222
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash ${{ secrets.PROD_DEPLOY_PATH }}/scripts/deploy.sh production

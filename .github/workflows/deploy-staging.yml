name: Build and Push Staging Image

on:
  push:
    branches:
      - develop

concurrency:
  group: build-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  checks:
    name: Type check y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: apps/web
        run: npx prisma generate

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Tests
        working-directory: apps/web
        run: npm test

      - name: Auditoría de seguridad npm
        run: npm audit --audit-level=high

  build:
    name: Build, scan y push imagen staging
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login a ghcr.io
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build imagen (local, para scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: ghcr.io/aacienfuegos/tripplanner:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Trivy v0.71.0
        run: |
          TRIVY_SHA256="30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz" \
            -O /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Trivy — informe completo (incluye CVEs sin fix disponible, no bloquea)
        run: |
          trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --vuln-type os,library \
            ghcr.io/aacienfuegos/tripplanner:staging

      - name: Scan de seguridad con Trivy (gate)
        run: |
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --vuln-type os,library \
            ghcr.io/aacienfuegos/tripplanner:staging

      - name: Push imagen
        run: docker push ghcr.io/aacienfuegos/tripplanner:staging

name: Build and Push Staging Image

on:
  push:
    branches:
      - develop

concurrency:
  group: build-staging
  cancel-in-progress: true

jobs:
  checks:
    name: Type check y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  build:
    name: Build y push imagen staging
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login a ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/aacienfuegos/tripplanner:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
